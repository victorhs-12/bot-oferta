shopee:
  url: https://shopee.com.br/
  categorias: 
    - nome: Cozinha
      ids_api: []
    
    - nome: Eletrônicos
      ids_api: []

  timeout_segundos: 90

# Filtragem no site da Shopee
filtros:
  preco:
    min: 60.00
    max: 2500.00
    desconto_minimo_percentual: 35
    
  qualidade:
    nota_minima: 4.5
    vendas_minimas: 250


# Configurações do WhatsApp
whatsapp:
  destino_grupo: "https://chat.whatsapp.com/EXEMPLO"
  modo_teste: true
  usar_wa_web: true


agendamento:
  ativar_agendamento: true
  horario_execucao: "10:00"
  horario_final_execucao: "18:00"
  intervalo_execucao_minutos: 60
  dias_execucao: 
    - segunda-feira
    - terça-feira
    - quarta-feira
    - quinta-feira
    - sexta-feira
